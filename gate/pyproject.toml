[project]
name = "xy-gate"
version = "0.1.0"
description = "闲鱼卖家机器人协议层：WS 长连接 + mtop 网关 + 风控闸门 + dsh 桥"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "websockets>=12.0",
    "PyYAML>=6.0",
    "uiautomator2>=3.7.0",
    "adbutils>=2.12.0",
]

[project.scripts]
xy-gate = "xy_gate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xy_gate"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
# 本机沙盒默认 tmp 目录无权限，统一落到项目内（见仓库 memory：Windows sandbox env quirks）
addopts = "--basetemp=.pytest_tmp"
testpaths = ["tests"]
